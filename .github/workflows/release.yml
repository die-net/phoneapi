name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PHONEAPI_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "PHONEAPI_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          PHONEAPI_VERSION: ${{ github.ref_name }}
          PHONEAPI_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          PHONEAPI_KEYSTORE_PASSWORD: ${{ secrets.PHONEAPI_KEYSTORE_PASSWORD }}
          PHONEAPI_KEY_ALIAS: ${{ secrets.PHONEAPI_KEY_ALIAS }}
          PHONEAPI_KEY_PASSWORD: ${{ secrets.PHONEAPI_KEY_PASSWORD }}
        run: ./gradlew spotlessCheck detektMain detektTest lint testDebugUnitTest :api-model:test assembleRelease buildHealth

      - name: Collect artifacts
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/phoneapi-${GITHUB_REF_NAME}.apk"
          cd dist && sha256sum *.apk > SHA256SUMS

      # Attestations on a private repository need GitHub Enterprise Cloud.
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*.apk

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS
          generate_release_notes: true
